---
name: Documentation

on:
  pull_request:
    branches:
      - main
    paths:
      - "config/**"
      - "source/**"
      - "tests/documentation/**"
      - "Makefile"
      - ".github/workflows/documentation.yml"
  push:
    branches:
      - main
    paths:
      - "config/**"
      - "source/**"
      - "tests/documentation/**"
      - "Makefile"
      - ".github/workflows/documentation.yml"

permissions: {}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ministryofjustice/tech-docs-github-pages-publisher@sha256:8b00235edfa4d1248e3cdd08c022d5f398c7f4abb3315b6078f1e876214a171e # v6.2.0
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        if: github.event.repository.private == false
        id: harden_runner
        uses: step-security/harden-runner@v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        id: checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Test navigation
        run: node --test tests/documentation/navigation.test.js

      - name: Build
        id: build
        run: |
          /usr/local/bin/package

      - name: Upload Artifact
        if: github.ref == 'refs/heads/main'
        id: upload_artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: github-pages
          path: artifact.tar
          retention-days: 1
          overwrite: true

  link-checker:
    if: github.event_name == 'pull_request'
    name: Link Checker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        if: github.event.repository.private == false
        id: harden_runner
        uses: step-security/harden-runner@v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        id: checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: >-
            --verbose --no-progress './**/*.md' './**/*.html' './**/*.erb'
            --accept 403,200,429
            --exclude '^https://github-community\.service\.justice\.gov\.uk/repository-standards/.*$'
            --exclude-path '(^|/)(apm_modules|docs)(/|$)'

  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    name: Publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.configure_pages.outputs.base_url }}
    permissions:
      contents: read
      id-token: write
      pages: write
    steps:
      - name: Configure Pages
        id: configure_pages
        uses: actions/configure-pages@v6.0.0

      - name: Deploy to GitHub Pages
        id: deploy_pages
        uses: actions/deploy-pages@v5.0.1