---
name: PagerDuty Terraform plan

on:
  pull_request:
    branches:
      - main
    paths:
      - "terraform/pagerduty/**"
      - ".github/workflows/pagerduty-plan.yml"
      - ".github/workflows/pagerduty-apply.yml"

permissions: {}

env:
  TERRAFORM_VERSION: "1.17.1"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

defaults:
  run:
    shell: bash
    working-directory: terraform/pagerduty

jobs:
  validate:
    name: Validate Terraform (no AWS access)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        if: github.event.repository.private == false
        uses: step-security/harden-runner@v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialise without the backend
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate
        run: terraform validate -no-color

  plan:
    name: Plan PagerDuty production
    needs: validate
    if: >-
      github.repository == 'ministryofjustice/integration-hub' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: pagerduty-terraform-plan-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      TF_WORKSPACE: default
      AWS_PAGER: ""

    steps:
      - name: Harden Runner
        if: github.event.repository.private == false
        uses: step-security/harden-runner@v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.PRODUCTION_ACCOUNT_ID }}:role/github-actions/integration-hub-pagerduty
          allowed-account-ids: ${{ secrets.PRODUCTION_ACCOUNT_ID }}
          role-session-name: pagerduty-plan-${{ github.run_id }}
          aws-region: eu-west-2
          mask-aws-account-id: true

      - name: Initialise the production backend
        run: terraform init -input=false -lockfile=readonly

      - name: Read the PagerDuty token and plan
        run: |
          token="$(aws secretsmanager get-secret-value \
            --region eu-west-2 \
            --secret-id pagerduty/api-key \
            --query SecretString \
            --output text)"

          if [[ -z "$token" || "$token" == "None" ||
                "$token" == *$'\n'* || "$token" == *$'\r'* ]]; then
            echo "::error::pagerduty/api-key must contain a non-empty, single-line API token."
            exit 1
          fi

          printf '::add-mask::%s\n' "${token//%/%25}"
          TF_VAR_pagerduty_token="$token" \
            terraform plan -input=false -no-color -lock-timeout=5m
