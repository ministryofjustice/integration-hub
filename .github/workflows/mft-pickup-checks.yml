name: MFT pickup checks

on:
  workflow_dispatch:
    inputs:
      environments_ref:
        description: 'Full infrastructure commit SHA to validate (no deployment)'
        required: true
        type: string
  pull_request:
    paths:
      - '.github/workflows/mft-pickup-checks.yml'
      - 'source/file-transfer-service/supported-patterns/pull-from-presigned-url.html.md.erb'
      - 'source/images/supported-patterns-pull-from-presigned-url/**'

permissions:
  contents: read

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENVIRONMENTS_REF: ${{ inputs.environments_ref || '0e74e737a47b0e67d048f02e883402538a2baaee' }}
    steps:
      - name: Require an immutable infrastructure revision
        shell: bash
        run: |
          if [[ ! "$ENVIRONMENTS_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Supply a full lowercase commit SHA"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ministryofjustice/modernisation-platform-environments
          ref: ${{ env.ENVIRONMENTS_REF }}
          path: environments
          persist-credentials: false
      - name: Test notifier, retention and shared dispatcher contract
        working-directory: environments
        env:
          PYTHONPATH: terraform/environments/integration-hub-file-transfer/pull-from-presigned-url/lambda/notifier
        run: python3 -m unittest discover -s terraform/environments/integration-hub-file-transfer/pull-from-presigned-url/lambda/notifier/tests -v
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1"
          terraform_wrapper: false
      - name: Validate pickup component without AWS credentials or backend
        working-directory: environments/terraform/environments/integration-hub-file-transfer/pull-from-presigned-url
        run: |
          terraform init -backend=false -input=false
          terraform validate -no-color
