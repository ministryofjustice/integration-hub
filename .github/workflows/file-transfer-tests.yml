---
name: File Transfer Tests

on:
  workflow_dispatch:
  push:
    branches:
      - smoke-test
    paths:
      - "tests/file_transfer/**"
      - ".github/workflows/file-transfer-tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "tests/file_transfer/**"
      - ".github/workflows/file-transfer-tests.yml"

permissions: {}

jobs:
  unit-tests:
    name: Check smoke-test logic without AWS
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        if: github.event.repository.private == false
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run local unit tests
        run: python3 -B -m unittest discover -s tests/file_transfer -p 'test_*.py' -v

  file-transfer-tests:
    name: Run file-transfer tests
    needs: unit-tests
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/smoke-test')
    runs-on: ubuntu-latest
    environment: smoke-test
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden Runner
        if: github.event.repository.private == false
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check smoke-test configuration
        shell: bash
        env:
          ACCOUNT_ID: ${{ vars.ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          if [[ ! "$ACCOUNT_ID" =~ ^[0-9]{12}$ ]]; then
            echo "::error::Set ACCOUNT_ID to the 12-digit test account ID in the smoke-test environment."
            exit 1
          fi
          if [[ "$AWS_REGION" != "eu-west-2" ]]; then
            echo "::error::Set AWS_REGION to eu-west-2 in the smoke-test environment."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::${{ vars.ACCOUNT_ID }}:role/integration-hub-file-transfer-test-harness-test
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - name: Check AWS identity
        shell: bash
        env:
          EXPECTED_ACCOUNT_ID: ${{ vars.ACCOUNT_ID }}
        run: |
          identity_arn=$(aws sts get-caller-identity --query Arn --output text)
          expected_prefix="arn:aws:sts::${EXPECTED_ACCOUNT_ID}:assumed-role/integration-hub-file-transfer-test-harness-test/"
          if [[ "$identity_arn" != "$expected_prefix"* ]]; then
            echo "::error::AWS identity does not match the configured test account and harness role."
            exit 1
          fi
          echo "AWS authentication verified for the configured test account and harness role."
          {
            echo "### File-transfer harness authentication"
            echo "Successfully assumed the dedicated harness role in the configured test account."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run push-to-S3 smoke test
        id: smoke_test
        run: python3 -B tests/file_transfer/smoke_test.py

      - name: Report smoke-test result
        if: always()
        shell: bash
        env:
          SMOKE_TEST_OUTCOME: ${{ steps.smoke_test.outcome }}
        run: |
          {
            echo "### File-transfer smoke test"
            case "$SMOKE_TEST_OUTCOME" in
              success) echo "PASS: uploaded a unique fixture and verified identical delivered contents." ;;
              failure) echo "FAIL: the smoke test failed. Check the run logs and run token." ;;
              *) echo "The smoke test did not complete. Check preceding steps or cancellation." ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"