---
name: PagerDuty Terraform

on:
  pull_request:
    branches:
      - main
    paths:
      - "terraform/pagerduty/**"
      - ".github/workflows/pagerduty-terraform.yml"
  push:
    branches:
      - main
    paths:
      - "terraform/pagerduty/**"
      - ".github/workflows/pagerduty-terraform.yml"

permissions: {}

env:
  TERRAFORM_VERSION: "1.17.1"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

defaults:
  run:
    shell: bash
    working-directory: terraform/pagerduty

jobs:
  validate:
    name: Validate Terraform (no AWS access)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        if: github.event.repository.private == false
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialise without the backend
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate
        run: terraform validate -no-color

  plan:
    name: Plan PagerDuty production
    needs: validate
    if: >-
      github.repository == 'ministryofjustice/integration-hub' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pagerduty-production-plan
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: pagerduty-terraform-plan-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      TF_WORKSPACE: default
      AWS_PAGER: ""

    steps:
      - name: Harden Runner
        if: github.event.repository.private == false
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.PRODUCTION_ACCOUNT_ID }}:role/github-actions/integration-hub-pagerduty-plan
          allowed-account-ids: ${{ secrets.PRODUCTION_ACCOUNT_ID }}
          role-session-name: pagerduty-plan-${{ github.run_id }}
          aws-region: eu-west-2
          mask-aws-account-id: true

      - name: Initialise the production backend
        run: terraform init -input=false -lockfile=readonly

      - name: Read the read-only PagerDuty token and plan
        run: |
          token="$(aws secretsmanager get-secret-value \
            --region eu-west-2 \
            --secret-id pagerduty/api-key-read-only \
            --query SecretString \
            --output text)"

          if [[ -z "$token" || "$token" == "None" ||
                "$token" == *$'\n'* || "$token" == *$'\r'* ]]; then
            echo "::error::pagerduty/api-key-read-only must contain a non-empty, single-line API token."
            exit 1
          fi

          printf '::add-mask::%s\n' "${token//%/%25}"

          TF_VAR_pagerduty_token="$token" \
            terraform plan -input=false -no-color -lock-timeout=5m

  apply:
    name: Apply PagerDuty production
    needs: validate
    if: >-
      github.repository == 'ministryofjustice/integration-hub' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: pagerduty-terraform-apply
      cancel-in-progress: false
    env:
      TF_WORKSPACE: default
      AWS_PAGER: ""

    steps:
      - name: Harden Runner
        if: github.event.repository.private == false
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.PRODUCTION_ACCOUNT_ID }}:role/github-actions/integration-hub-pagerduty
          allowed-account-ids: ${{ secrets.PRODUCTION_ACCOUNT_ID }}
          role-session-name: pagerduty-apply-${{ github.run_id }}
          aws-region: eu-west-2
          mask-aws-account-id: true

      - name: Initialise the production backend
        run: terraform init -input=false -lockfile=readonly

      - name: Read the PagerDuty token, plan and apply
        run: |
          token="$(aws secretsmanager get-secret-value \
            --region eu-west-2 \
            --secret-id pagerduty/api-key \
            --query SecretString \
            --output text)"

          if [[ -z "$token" || "$token" == "None" ||
                "$token" == *$'\n'* || "$token" == *$'\r'* ]]; then
            echo "::error::pagerduty/api-key must contain a non-empty, single-line API token."
            exit 1
          fi

          printf '::add-mask::%s\n' "${token//%/%25}"

          # The ephemeral token is not saved in the plan, so apply needs it again.
          TF_VAR_pagerduty_token="$token" \
            terraform plan -input=false -no-color -lock-timeout=5m -out=pagerduty.tfplan

          TF_VAR_pagerduty_token="$token" \
            terraform apply -input=false -no-color -lock-timeout=5m pagerduty.tfplan
